name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    strategy:
      # Match the engine and licensing repos: keep the Linux signal independent from Windows.
      # Windows matters here specifically because it is where the .js MIME mapping goes wrong.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyflakes

      - name: Lint (pyflakes)
        run: python -m pyflakes build.py serve.py tests

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build the site
        run: python build.py --contact sales@example.com

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.os }}
          path: dist/
