<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESC}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307080c'/%3E%3Ctext x='16' y='22' font-size='15' font-family='monospace' font-weight='bold' fill='%235ad2f5' text-anchor='middle'%3ECB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<script>
  /* Synchronous and tiny, on purpose. The module script below is deferred, so waiting for it
     would show the page first and *then* cover it — the transition has to be in place before
     the first paint or it reads as a glitch.

     Two safety properties matter more than the effect itself:
       - with JavaScript off this never runs, `.xfer` stays `display:none`, and every link is
         an ordinary anchor;
       - if the module never executes (network error, syntax error, blocked import) the
         timeout uncovers the page anyway. An overlay that can outlive its script is a way to
         make a site permanently unusable, so it gets a deadline rather than a promise. */
  (function () {
    try {
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { return }
      var d = document.documentElement
      d.classList.add('xfer-cover')
      setTimeout(function () { d.classList.remove('xfer-cover') }, 1800)
    } catch (e) { /* never let the transition break the page */ }
  })()
</script>
<style>
  /* A deliberately single-look design: near-black ground, one statement per screen,
     tte.js carrying the motion. Colours are painted explicitly rather than inherited. */
  :root {
    --bg:#07080c; --bg-2:#0b0d13;
    --fg:#f2f4f8; --fg-soft:#98a0b4; --fg-faint:#5d6577;
    --accent:#5ad2f5; --accent-2:#a78bfa; --warn:#ffb454; --ok:#4fd39b;
    --rule:rgba(242,244,248,.13);
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans);
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  code { font-family:var(--mono); font-size:.88em; color:var(--accent); }

  /* ── screens: one statement each ─────────────────────────────── */
  .screen { min-height:100svh; display:flex; align-items:center; padding:14vh 0;
    border-bottom:1px solid var(--rule); position:relative; }
  .screen:last-of-type { border-bottom:0; }
  .inner { width:100%; max-width:1500px; margin:0 auto; padding:0 clamp(20px,5vw,80px); }

  /* the animated statement — tte.js measures this element and overlays a canvas on it */
  .line { font-family:var(--mono); font-weight:700; letter-spacing:-.035em; line-height:1.02;
    font-size:clamp(26px,7.2vw,116px); margin:0; white-space:pre; color:var(--fg);
    overflow-x:auto; overflow-y:hidden; }
  .line.sm { font-size:clamp(22px,4.6vw,68px); }
  .accent { color:var(--accent); }

  .cap { font-family:var(--mono); font-size:clamp(10px,1.05vw,12.5px); letter-spacing:.24em;
    text-transform:uppercase; color:var(--fg-faint); margin:0 0 clamp(18px,3vw,40px);
    display:flex; align-items:center; gap:14px; }
  .cap::after { content:""; flex:1; height:1px; background:var(--rule); }
  .sub { color:var(--fg-soft); font-size:clamp(15px,1.35vw,19px); max-width:60ch;
    margin:clamp(22px,3.5vw,44px) 0 0; }
  .sub strong { color:var(--fg); font-weight:500; }

  .btn { display:inline-flex; align-items:center; gap:10px; font-family:var(--mono);
    font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    padding:16px 28px; border:1px solid var(--fg); color:var(--fg); background:transparent;
    transition:background .18s, color .18s; }
  .btn:hover { background:var(--fg); color:var(--bg); text-decoration:none; }
  .btn.on { background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .btn.on:hover { filter:brightness(1.1); background:var(--accent); color:var(--bg); }
  .row { display:flex; flex-wrap:wrap; gap:14px; margin-top:clamp(26px,4vw,48px); }

  /* nav — minimal, just a mark and one action */
  header { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center;
    gap:16px; padding:18px clamp(20px,5vw,80px); font-family:var(--mono); font-size:12.5px;
    letter-spacing:.16em; text-transform:uppercase; mix-blend-mode:difference; }
  header .mark { font-weight:700; }
  header .spacer { flex:1; }
  header a { color:var(--fg); }

  /* small supporting grids, kept sparse */
  .facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:1px; background:var(--rule); border:1px solid var(--rule);
    margin-top:clamp(30px,4vw,56px); }
  .facts > div { background:var(--bg); padding:clamp(16px,2vw,26px); }
  .facts .k { font-family:var(--mono); font-size:clamp(24px,3vw,40px); font-weight:700;
    color:var(--accent); line-height:1; letter-spacing:-.04em; }
  .facts .v { color:var(--fg-soft); font-size:13px; margin-top:10px; }

  .tiers { margin-top:clamp(28px,4vw,52px); border-top:1px solid var(--rule); }
  .tiers div { display:grid; grid-template-columns:150px 1fr; gap:18px; padding:16px 0;
    border-bottom:1px solid var(--rule); align-items:baseline; }
  @media (max-width:680px) { .tiers div { grid-template-columns:1fr; gap:6px; } }
  .tiers b { font-family:var(--mono); font-size:15px; letter-spacing:.06em; text-transform:uppercase;
    font-weight:700; }
  .tiers span { color:var(--fg-soft); font-size:15px; }
  .t-open b { color:var(--warn); } .t-local b { color:var(--warn); }
  .t-split b { color:var(--ok); } .t-enclave b { color:var(--ok); }

  .langs { display:flex; flex-wrap:wrap; gap:10px 12px; margin-top:clamp(26px,3.5vw,46px);
    font-family:var(--mono); font-size:clamp(12px,1.15vw,15px); }
  /* Direct child only: chips now hold an inner .fx span (the tte.js target), which must not
     pick up the chip's border and padding. */
  .langs > span { border:1px solid var(--rule); padding:9px 15px; color:var(--fg-soft);
    letter-spacing:.06em; }
  /* The library wraps its target in an inline-grid box of its own. Keep that box from
     introducing a baseline of its own inside flex/grid parents. */
  .fx, [data-text-effect] { display:inline-block; }
  .cap .fx { white-space:nowrap; }

  .limits { margin-top:clamp(26px,3.5vw,46px); display:grid; gap:20px;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  .limits div { border-left:2px solid var(--warn); padding-left:18px; }
  .limits h3 { font-family:var(--mono); font-size:14px; text-transform:uppercase;
    letter-spacing:.06em; margin:0 0 8px; color:var(--warn); }
  .limits p { margin:0; color:var(--fg-soft); font-size:14.5px; }

  footer { padding:40px clamp(20px,5vw,80px); font-family:var(--mono); font-size:11.5px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--fg-faint);
    display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between;
    border-top:1px solid var(--rule); }

  /* tte.js overlays an aria-hidden canvas; the source text stays in the DOM, so with no
     JS (or with reduced motion) the page is simply read as static type. */
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
  /* ── page-transition overlay ───────────────────────────────────────────────────── */
  /* Hidden unless a class is set by script, so a no-JS visitor never meets it. The grid
     text is transparent because tte.js paints the visible characters onto its canvas; the
     source only exists to give the library a character grid to work from. */
  /* pointer-events:none is not cosmetic. The overlay lingers for a beat at opacity 0 while
     it fades out, and a fully transparent element still swallows clicks — which would make
     links dead for ~200ms after every arrival. It never needs input of its own. */
  #xfer { position:fixed; inset:0; z-index:200; background:var(--bg); display:none;
    opacity:0; pointer-events:none; transition:opacity .17s linear; }
  html.xfer-cover #xfer { display:block; }
  html.xfer-cover #xfer { opacity:1; }
  #xfer-grid { margin:0; width:100%; height:100%; font-family:var(--mono); line-height:1.1;
    color:transparent; white-space:pre; overflow:hidden; }

  /* ── secondary pages (about / contact / legal) ─────────────────────────────────── */
  header .mark { color:var(--fg); text-decoration:none; }
  footer .foot-nav a { color:var(--fg-soft); }
  .page { max-width:74ch; margin:0 auto; padding:clamp(110px,16vh,190px) clamp(20px,5vw,80px)
    clamp(70px,10vh,120px); }
  .page h1 { font-family:var(--mono); font-weight:700; letter-spacing:-.01em;
    font-size:clamp(30px,5.2vw,60px); line-height:1.04; margin:0 0 clamp(20px,3vw,34px); }
  .page h2 { font-family:var(--mono); font-size:clamp(15px,1.5vw,19px); text-transform:uppercase;
    letter-spacing:.14em; margin:clamp(46px,6vw,72px) 0 16px; padding-top:18px;
    border-top:1px solid var(--rule); }
  .page h3 { font-family:var(--mono); font-size:15px; letter-spacing:.04em; margin:28px 0 8px; }
  .page p, .page li { color:var(--fg-soft); font-size:16.5px; line-height:1.62; }
  .page p { margin:0 0 16px; }
  .page ul { margin:0 0 16px; padding-left:20px; }
  .page li { margin-bottom:8px; }
  .page strong { color:var(--fg); font-weight:500; }
  .page a { color:var(--accent); }
  .page .lede { font-size:clamp(17px,1.7vw,21px); color:var(--fg); margin-bottom:clamp(28px,4vw,44px); }

  /* key/value blocks: contact routes, legal identity, billing terms */
  .kv { display:grid; grid-template-columns:200px 1fr; gap:12px 24px; margin:0 0 22px;
    border-top:1px solid var(--rule); padding-top:18px; }
  .kv dt { font-family:var(--mono); font-size:12.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--fg-faint); }
  .kv dd { margin:0; color:var(--fg-soft); font-size:16px; }
  .kv dd a { color:var(--accent); }
  @media (max-width:640px) { .kv { grid-template-columns:1fr; gap:4px 0; }
    .kv dd { margin-bottom:14px; } }

  /* An operator value that has not been configured. Deliberately conspicuous: a marketing
     site inventing a registered address or a support mailbox is worse than one admitting the
     field is empty, and this makes an unfilled build obvious rather than plausible. */
  .unset { font-family:var(--mono); font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--warn); border:1px dashed var(--warn); padding:2px 8px; white-space:nowrap; }

  .notice { border:1px solid var(--warn); border-left-width:3px; padding:18px 22px;
    margin:0 0 clamp(30px,4vw,44px); }
  .notice p { margin:0; color:var(--fg); font-size:15.5px; }
  .notice p + p { margin-top:10px; color:var(--fg-soft); }
  .notice b { font-family:var(--mono); text-transform:uppercase; letter-spacing:.12em;
    font-size:12.5px; color:var(--warn); display:block; margin-bottom:8px; }
</style>
</head>
<body>

<div id="xfer" aria-hidden="true"><pre id="xfer-grid"></pre></div>

<header>
  <a class="mark" href="./index.html">{{VENDOR_NAME}}</a>
  <span class="spacer"></span>
  <a href="./about.html">About</a>
  <a href="./contact.html">Contact</a>
  <a href="./legal.html">Legal</a>
  <a href="{{CONTACT_HREF}}">Request access →</a>
</header>
{{CONTENT}}
<footer>
  <span>© {{YEAR}} {{VENDOR_NAME}} — secure distribution &amp; execution control</span>
  <span class="foot-nav"><a href="./about.html">About</a> · <a href="./contact.html">Contact</a>
    · <a href="./legal.html">Terms &amp; privacy</a></span>
  <span>{{CONTACT_LABEL}}</span>
</footer>
<script type="module">
  // Relative, NOT '/vendor/...'. GitHub Pages serves a project site under a subpath
  // (/<repo>/), where a root-absolute specifier resolves to the domain root and 404s.
  // Relative resolves against this document, so the same build works at a subpath, at a
  // custom domain's root, and from `python serve.py` alike.
  import { createTextEffect, effectNames } from './vendor/tte/src/index.js'

  // `<html data-tte>` exposes how far the bootstrap got: module -> bootstrapping -> observing
  // -> running. Kept deliberately: a Canvas overlay has no other observable state, so without
  // it "the effect silently never started" and "the effect finished" look identical to a
  // browser test. Nothing reads it at runtime; it is a diagnostic seam, not behaviour.
  const mark = (v) => { document.documentElement.dataset.tte = v }
  mark('module')
  const known = new Set(effectNames())

  // ── full-screen decrypt on arrival ───────────────────────────────────────────────
  // Every page opens behind a full-screen grid of random hex that decrypts away, using the
  // same library as the rest of the site — so moving between pages reads as decrypting into
  // the new one. It costs nothing but a covered first paint.
  //
  // It is deliberately arrival-only. An earlier version also intercepted link clicks to run
  // an "encrypt" effect *before* navigating, and that could not be made reliable: in browser
  // testing the click was intermittently swallowed with no navigation request issued at all,
  // leaving the visitor stuck on the page with no error. A decorative transition is not worth
  // a link that sometimes does nothing, so links are now ordinary anchors that the browser
  // handles itself, and nothing here can sit between a click and the page it asks for.
  //
  // What remains still cannot strand anyone: the overlay uncovers on a fixed timer rather
  // than when an animation finishes, and the head script's failsafe removes it even if this
  // module never runs.
  const root = document.documentElement
  const xfer = document.getElementById('xfer')
  const xferGrid = document.getElementById('xfer-grid')

  const fillGrid = () => {
    // The renderer stretches the character grid across the element's box, so the grid only
    // needs a plausible aspect ratio, not real font metrics. Rows are capped so a very tall
    // or very wide window cannot produce a cell count that costs frames.
    const rows = Math.max(12, Math.min(30, Math.round(window.innerHeight / 34)))
    const ratio = (window.innerWidth / Math.max(1, window.innerHeight)) / 0.47
    const cols = Math.max(20, Math.min(120, Math.round(rows * ratio)))
    const alphabet = '0123456789ABCDEF#$%&*+=/\\|<>[]{}'
    let out = ''
    for (let r = 0; r < rows; r++) {
      let line = ''
      for (let c = 0; c < cols; c++) {
        line += alphabet[(Math.random() * alphabet.length) | 0]
      }
      out += line + (r < rows - 1 ? '\n' : '')
    }
    xferGrid.textContent = out
  }

  // One controller at a time on the shared overlay grid: mounting a second effect over a live
  // one wraps an already-wrapped element and leaves the DOM in a state neither can clean up.
  let overlayFx = null
  const clearOverlay = () => {
    if (overlayFx) { try { overlayFx.destroy() } catch (e) {} ; overlayFx = null }
  }

  const runOverlay = (effect, duration) => {
    clearOverlay()
    try {
      fillGrid()
      overlayFx = createTextEffect(xferGrid, {
        effect: known.has(effect) ? effect : 'decrypt',
        colors: ['#5ad2f5', '#a78bfa'], duration, seed: (Math.random() * 9999) | 0,
        autoplay: false,
      })
      void overlayFx.restart()
    } catch (err) {
      console.warn('[tte] transition effect failed; skipping it', err)
      overlayFx = null
    }
  }

  // Arrival: the head script already covered the page, so decrypt, then uncover. The uncover
  // is on a timer rather than chained off the effect's promise -- the page must become usable
  // on a schedule, not whenever an animation decides it is finished.
  const arrive = () => {
    if (!root.classList.contains('xfer-cover')) { return }
    runOverlay('decrypt', 620)
    setTimeout(() => {
      xfer.style.opacity = '0'
      setTimeout(() => { clearOverlay(); root.classList.remove('xfer-cover') }, 200)
    }, 640)
  }

  // Departure: encrypt over the page, then navigate. 420ms is the ceiling — a transition a
  // visitor notices waiting on is worse than no transition.
  // Restoring from the back/forward cache re-runs no scripts, so a page that went into it
  // while still covered would come back covered. Clear it explicitly.
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      clearOverlay()
      root.classList.remove('xfer-cover')
      xfer.style.opacity = ''
    }
  })
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
  if (!reduce) { arrive() }
  const lines = Array.from(document.querySelectorAll('.line[data-effect]'))

  // Reduced motion: leave every statement as plain static type. The source text is already in
  // the DOM, so this is simply "do nothing" — no fallback rendering needed.
  if (!reduce && 'IntersectionObserver' in window) {
    mark('bootstrapping')
    const controllers = new Map()

    const build = (el) => {
      let name = (el.dataset.effect || '').trim()
      if (!known.has(name)) {
        // A misspelt effect throws inside the library; fall back rather than lose the headline.
        console.warn(`[tte] unknown effect "${name}" — falling back to laseretch`)
        name = 'laseretch'
      }
      const colors = (el.dataset.colors || '#5ad2f5,#f2f4f8').split(',').map((c) => c.trim())
      // autoplay:false — the constructor otherwise queues a play() of its own, so the
      // explicit restart() below would be immediately cancelled and replaced by it. Harmless
      // here (same effect, same seed) but it makes the returned promise meaningless, which
      // the micro layer below depends on.
      return createTextEffect(el, {
        effect: name, colors, duration: 2200, seed: 7, autoplay: false,
      })
    }

    const enter = (el) => {
      // Already animating for this visit — do NOT restart. The immediate kick below and the
      // observer's initial callback both land on the in-view lines, and restarting on the
      // second one relaunches the animation, leaving the headline stuck mid-effect. Leaving
      // view destroys the controller, so a genuine re-entry always rebuilds from scratch.
      if (controllers.has(el)) { return }
      try {
        const fx = build(el)
        controllers.set(el, fx)
        void fx.restart()            // constructing a TextEffect does not start it
        mark('running')
      } catch (err) {
        console.warn('[tte] effect failed; leaving static text', err)
        io.unobserve(el)
      }
    }

    // Fire on ANY sliver of the element being visible. A percentage threshold is wrong here:
    // these headlines can be taller than the viewport, so a high threshold is unreachable and
    // the effect would never run. Screens are full-height, so at most two ever overlap.
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        const el = e.target
        if (e.isIntersecting) {
          enter(el)
        } else {
          // destroy(), NEVER stop(). The library sets the source element to
          // `color: transparent` and paints a canvas over it; stop() only halts the render
          // loop, leaving an empty canvas above invisible text — the headline would vanish
          // for good. destroy() restores the inline style and unwraps, so the plain text
          // returns and the next entry rebuilds cleanly.
          controllers.get(el)?.destroy()
          controllers.delete(el)
        }
      }
    }, { threshold: 0.01 })

    // Wait for the webfont before measuring — tte.js builds a character grid from the
    // element's box, and a fallback face would size that grid wrong. But never let a font
    // promise that does not settle block the page: race it against a short timeout.
    const start = () => {
      if (started) { return }
      started = true
      mark('observing')
      // Kick anything already on screen directly. IntersectionObserver delivery is async and
      // and not guaranteed to arrive promptly, and the hero must not wait on it.
      for (const el of lines) {
        const r = el.getBoundingClientRect()
        if (r.top < window.innerHeight && r.bottom > 0) { enter(el) }
      }
      lines.forEach((el) => io.observe(el))
    }
    let started = false
    const fontsReady = (document.fonts && document.fonts.ready)
      ? document.fonts.ready : Promise.resolve()
    Promise.race([fontsReady, new Promise((r) => setTimeout(r, 1200))]).then(start).catch(start)

    // ── the same library, on the small type ────────────────────────────────────────────
    // Buttons, nav links, eyebrows, tier names and language chips. Three rules make this
    // work where a naive application does not:
    //
    //  1. NEVER target a padded element. The renderer spreads its character grid across the
    //     target's whole border box and derives font size from the box height
    //     (CanvasRenderer.resize). `.btn` has 16px/28px of padding and `.langs > span` has
    //     9px/15px, so aiming at them would draw a stretched, oversized label. Every target
    //     here is an inner `.fx` span that hugs its text exactly.
    //  2. End on the element's own colour. The last colour in the ramp is the computed
    //     colour of the text itself, so the hand-off from canvas back to DOM text on destroy
    //     is invisible instead of a flash.
    //  3. Always destroy, never stop. Same reason as the headlines: the library paints over
    //     text it has set to `color: transparent`, so anything short of destroy() can strand
    //     a button with no visible label.
    const micro = new Map()

    // tte.js accepts HEX ONLY -- core.js normalizeColor() throws TypeError on anything else,
    // and getComputedStyle().color always returns `rgb(...)`. Convert. Two failure modes this
    // closes, both found in the browser rather than in review:
    //   - the throw happens *inside the constructor, after it has mounted*, so a bad colour
    //     left an orphaned canvas over a label already set to `color: transparent` -- an
    //     invisible button, and a fresh leaked canvas on every hover;
    //   - reading the colour lazily returns `rgba(0, 0, 0, 0)` while an effect is running,
    //     so feeding it back in throws again. Capture it once, up front, before anything runs.
    const toHex = (css) => {
      const m = String(css).match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)$/)
      if (!m || (m[4] !== undefined && Number(m[4]) === 0)) { return '' }
      return '#' + [m[1], m[2], m[3]].map((n) => Number(n).toString(16).padStart(2, '0')).join('')
    }

    const cfg = new WeakMap()   // element -> {effect, ms, colors} captured while text is visible

    const unwrap = (el) => {
      // Undo a partial mount by hand. The library only unwraps in destroy(), which we never
      // reach if the constructor threw, and a stranded wrapper means a permanently blank label.
      const w = el.parentElement
      if (w && w.dataset && w.dataset.textEffect !== undefined) {
        w.parentNode?.insertBefore(el, w)
        w.remove()
      }
      el.style.color = ''
      el.style.textShadow = ''
      el.style.caretColor = ''
    }

    const runMicro = (el) => {
      const c = cfg.get(el)
      if (!c || micro.has(el)) { return }        // unwired, or already animating
      let fx
      try {
        // autoplay:false is load-bearing here. With the library's default (true) the
        // constructor queues its own play(); that second play() calls stop() on the run
        // restart() had just begun, which resolves OUR promise as {cancelled:true} — so the
        // completion handler fired a microtask in and destroyed the effect before a single
        // frame was painted. The label simply never animated, silently and with no error.
        fx = createTextEffect(el, {
          effect: c.effect, colors: c.colors, duration: c.ms, seed: 3, autoplay: false,
        })
      } catch (err) {
        console.warn('[tte] micro effect failed; restoring static text', err)
        unwrap(el)
        cfg.delete(el)                            // do not keep retrying a target that throws
        return
      }
      micro.set(el, fx)
      const done = () => { if (micro.get(el) === fx) { fx.destroy(); micro.delete(el) } }
      fx.restart().then(done).catch((err) => { console.warn('[tte]', err); done() })
    }

    const stopMicro = (el) => {
      const fx = micro.get(el)
      if (fx) { fx.destroy(); micro.delete(el) }
    }

    const wire = (sel, effect, ms, accent) => {
      const out = []
      for (const el of document.querySelectorAll(sel)) {
        // Captured now, while the label is still its real colour. Ending the ramp on that
        // exact value makes the hand-off from canvas back to DOM text invisible on destroy.
        const end = toHex(getComputedStyle(el).color) || '#f2f4f8'
        const name = known.has(effect) ? effect : 'laseretch'
        cfg.set(el, { effect: name, ms, colors: accent ? [accent, end] : [end] })
        out.push(el)
      }
      return out
    }

    // Hover: buttons and header links. Pointer events (not mouse) so a tap runs it on touch
    // too; the library's canvas is `pointer-events: none`, so the link stays clickable
    // throughout and the text underneath stays selectable and readable to a screen reader.
    for (const [sel, effect, ms, accent] of [
      ['.btn .fx', 'decrypt', 460, '#5ad2f5'],
      ['header a', 'scattered', 420, '#5ad2f5'],
    ]) {
      for (const el of wire(sel, effect, ms, accent)) {
        el.addEventListener('pointerenter', () => runMicro(el))
        el.addEventListener('pointerleave', () => stopMicro(el))
      }
    }

    // Scroll-in, staggered. One-shot per element: the observer stops watching once fired, so
    // scrolling a section past repeatedly does not re-scramble its labels at the reader.
    const microIO = new IntersectionObserver((entries) => {
      entries.filter((e) => e.isIntersecting).forEach((e, i) => {
        microIO.unobserve(e.target)
        setTimeout(() => runMicro(e.target), Math.min(i, 10) * 55)
      })
    }, { threshold: 0.6 })

    for (const [sel, effect, ms, accent] of [
      ['.cap .fx', 'wipe', 620, ''],
      ['.tiers b', 'decrypt', 700, ''],
      ['.langs .fx', 'binarypath', 700, '#5ad2f5'],
    ]) {
      wire(sel, effect, ms, accent).forEach((el) => microIO.observe(el))
    }
  }
</script>
</body>
</html>
